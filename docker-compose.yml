services:
  pharmacy-solver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmacy_solver_app
    ports:
      - "8001:8001"
    volumes:
      # Internal named volume for container isolation:
      - pharmacy_data:/app/data
      # To bind-mount to local host directory instead, swap comments with the line below:
      # - ./data:/app/data
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  pharmacy_data:
    driver: local
